name: CI

on:
  pull_request:
  push:
    branches: [main, develop, MajorFixBeta]

jobs:
  backend:
    name: Backend (typecheck + Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck -w Backend
      - name: Jest
        run: npm test -w Backend

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint -w Frontend
      - name: Typecheck
        run: npm run typecheck -w Frontend
      - name: Build
        run: npm run build -w Frontend
