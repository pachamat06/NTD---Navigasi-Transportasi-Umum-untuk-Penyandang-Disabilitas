# PostgreSQL untuk pengembangan lokal: docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ntd
      POSTGRES_PASSWORD: ntd
      POSTGRES_DB: ntd
    ports:
      - "5432:5432"
    volumes:
      - ntd-db:/var/lib/postgresql/data
volumes:
  ntd-db:
